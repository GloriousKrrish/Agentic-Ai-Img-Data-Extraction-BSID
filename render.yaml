services:
  - type: web
    name: agentic-ai-doc-extraction-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_PRIMARY_MODEL
        value: gemini-2.5-flash
      - key: MODELS_PRIORITY
        value: gemini-2.5-flash,gemini-2.5-flash-lite,gemini-flash-latest
